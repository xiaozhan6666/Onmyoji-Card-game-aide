[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bwp-collector"
version = "0.1.0"
description = "百闻牌离线截图识别与样本校验工具"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4", "Pillow==11.3.0", "opencv-contrib-python==4.10.0.84",
  "PyYAML==6.0.2", "jsonschema==4.25.1", "uuid6==2025.0.1"
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
ocr = ["paddleocr==3.3.2", "paddlepaddle==3.2.2"]

[project.scripts]
bwp-collector = "bwp_collector.cli:main"

[tool.setuptools.packages.find]
where = ["collector/src"]

[tool.pytest.ini_options]
pythonpath = ["collector/src"]
testpaths = ["collector/tests"]
